<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventário de TI — Equipamentos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>🖥️ Inventário de TI</h1>
    <button class="hamb-btn" id="btn-menu" aria-label="Abrir menu" aria-expanded="false">☰</button>
    <nav class="hamb-menu" id="menu-nav" hidden>
      <a href="/" class="active">Equipamentos</a>
      <a href="/historico.html">Histórico</a>
      <a href="/relatorios.html" id="link-relatorios">Relatórios</a>
      <div class="menu-usuario">
        <span id="usuario-nome"></span>
        <button type="button" id="btn-sair" class="secundario">Sair</button>
      </div>
    </nav>
  </header>

  <div id="aviso" class="aviso" hidden></div>

  <main>
    <section id="secao-form">
      <h2 id="form-titulo">Novo equipamento</h2>
      <form id="form-equipamento">
        <label>Nome
          <input type="text" id="nome" maxlength="80" required />
        </label>
        <label>Tipo
          <input type="text" id="tipo" maxlength="40" required list="tipos-lista" />
          <datalist id="tipos-lista"></datalist>
        </label>
        <label>Número de patrimônio
          <input type="text" id="numero_patrimonio" maxlength="40" required />
        </label>
        <label>Número de série
          <input type="text" id="numero_serie" maxlength="60" />
        </label>
        <label>Marca
          <input type="text" id="marca" maxlength="60" required />
        </label>
        <label>Modelo
          <input type="text" id="modelo" maxlength="60" required />
        </label>
        <label>Valor de aquisição (R$)
          <input type="number" id="valor" min="0.01" step="0.01" />
        </label>
        <label>Foto do equipamento
          <input type="file" id="imagem" accept="image/jpeg,image/png,image/webp" />
        </label>
        <img id="preview-imagem" class="preview-img" hidden alt="Prévia da foto" />

        <div class="acoes">
          <button type="submit" id="btn-salvar">Salvar equipamento</button>
          <button type="button" id="btn-cancelar" hidden>Cancelar edição</button>
        </div>
      </form>
    </section>

    <section id="secao-lista">
      <h2>Equipamentos</h2>
      <div id="status-tabs" class="categoria-tabs"></div>
      <table>
        <thead>
          <tr>
            <th>Foto</th><th>Nome</th><th>Patrimônio</th><th>Marca/Modelo</th>
            <th>Valor</th><th>Status</th><th></th>
          </tr>
        </thead>
        <tbody id="lista-equipamentos"></tbody>
      </table>
      <p id="equipamentos-vazio" hidden>Nenhum equipamento encontrado.</p>
    </section>
  </main>

  <dialog id="dialog-atribuir">
    <h3>Atribuir equipamento</h3>
    <p id="atribuir-equipamento-nome" class="dialog-subtitulo"></p>
    <form id="form-atribuir">
      <label>Responsável
        <input type="text" id="atribuir-responsavel" maxlength="80" required />
      </label>
      <label>Setor
        <input type="text" id="atribuir-setor" maxlength="60" required list="setores-lista" />
        <datalist id="setores-lista"></datalist>
      </label>
      <label>Observação
        <input type="text" id="atribuir-observacao" maxlength="255" />
      </label>
      <div class="acoes">
        <button type="submit">Confirmar atribuição</button>
        <button type="button" id="btn-cancelar-atribuir" class="secundario">Cancelar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dialog-manutencao">
    <h3>Enviar para manutenção</h3>
    <p id="manutencao-equipamento-nome" class="dialog-subtitulo"></p>
    <form id="form-manutencao">
      <label>Motivo
        <input type="text" id="manutencao-motivo" maxlength="255" required />
      </label>
      <label>Custo estimado (R$)
        <input type="number" id="manutencao-custo" min="0.01" step="0.01" />
      </label>
      <label>Observação
        <input type="text" id="manutencao-observacao" maxlength="255" />
      </label>
      <div class="acoes">
        <button type="submit">Confirmar envio</button>
        <button type="button" id="btn-cancelar-manutencao" class="secundario">Cancelar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
