<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventário de TI — Equipamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="sidebar-brand-icon">🖥️</span>
        <span class="sidebar-brand-text">Inventário TI</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/" class="sidebar-link">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg>
          <span>Dashboard</span>
        </a>
        <a href="/equipamentos.html" class="sidebar-link ativo">
          <svg viewBox="0 0 24 24"><path d="M3 7.5 12 3l9 4.5-9 4.5-9-4.5Z"/><path d="M3 7.5v9L12 21l9-4.5v-9"/><path d="M12 12v9"/></svg>
          <span>Equipamentos</span>
        </a>
        <a href="/historico.html" class="sidebar-link">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
          <span>Histórico</span>
        </a>
        <a href="/relatorios.html" class="sidebar-link" id="link-relatorios">
          <svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M4 20V11M10 20V4M16 20v6M21 20H3"/></svg>
          <span>Relatórios</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" id="avatar-iniciais">—</div>
          <div class="sidebar-user-info">
            <strong id="usuario-nome">—</strong>
            <small id="usuario-papel">—</small>
          </div>
        </div>
        <button type="button" id="btn-sair" class="sidebar-sair">Sair</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div>
          <button type="button" class="link-btn" onclick="window.location.href='/equipamentos.html'">← Equipamentos</button>
          <h1 id="pagina-titulo">Equipamento</h1>
        </div>
      </header>

      <main class="content">
        <div class="record-header">
          <div>
            <div class="record-header-titulo">
              <h2 id="eq-nome">—</h2>
              <span class="badge-status" id="eq-status-badge"></span>
            </div>
            <div class="record-header-meta" id="eq-meta">—</div>
          </div>
          <div class="record-header-acoes" id="eq-acoes"></div>
        </div>

        <div class="tabs">
          <button type="button" class="tab-btn ativa" data-tab="detalhes">Detalhes</button>
          <button type="button" class="tab-btn" data-tab="atribuicoes">Atribuições</button>
          <button type="button" class="tab-btn" data-tab="manutencoes">Manutenções</button>
          <button type="button" class="tab-btn" data-tab="atividade">Atividade</button>
        </div>

        <section class="tab-panel panel" id="tab-detalhes">
          <div id="detalhes-visualizacao" class="campos-grid"></div>

          <form id="form-editar" hidden>
            <div class="campos-grid">
              <label>Nome
                <input type="text" id="edit-nome" maxlength="80" required />
              </label>
              <label>Tipo
                <input type="text" id="edit-tipo" maxlength="40" required />
              </label>
              <label>Número de patrimônio
                <input type="text" id="edit-numero_patrimonio" maxlength="40" required />
              </label>
              <label>Número de série
                <input type="text" id="edit-numero_serie" maxlength="60" />
              </label>
              <label>Marca
                <input type="text" id="edit-marca" maxlength="60" required />
              </label>
              <label>Modelo
                <input type="text" id="edit-modelo" maxlength="60" required />
              </label>
              <label>Valor de aquisição (R$)
                <input type="number" id="edit-valor" min="0.01" step="0.01" />
              </label>
              <label>Foto do equipamento
                <input type="file" id="edit-imagem" accept="image/jpeg,image/png,image/webp" />
              </label>
            </div>
            <img id="edit-preview-imagem" class="preview-img" hidden alt="Prévia da foto" />
            <div class="acoes">
              <button type="submit">Salvar alterações</button>
              <button type="button" id="btn-cancelar-edicao" class="secundario">Cancelar</button>
            </div>
          </form>
        </section>

        <section class="tab-panel panel" id="tab-atribuicoes" hidden>
          <table class="data-table">
            <thead><tr><th>Responsável</th><th>Setor</th><th>Retirada</th><th>Devolução</th><th></th></tr></thead>
            <tbody id="lista-atribuicoes"></tbody>
          </table>
          <p class="vazio" id="atribuicoes-vazio" hidden>Nenhuma atribuição para esse equipamento ainda.</p>
        </section>

        <section class="tab-panel panel" id="tab-manutencoes" hidden>
          <table class="data-table">
            <thead><tr><th>Motivo</th><th>Custo</th><th>Início</th><th>Fim</th><th></th></tr></thead>
            <tbody id="lista-manutencoes"></tbody>
          </table>
          <p class="vazio" id="manutencoes-vazio" hidden>Nenhuma manutenção para esse equipamento ainda.</p>
        </section>

        <section class="tab-panel panel" id="tab-atividade" hidden>
          <div id="atividade-feed" class="activity-feed"></div>
        </section>
      </main>
    </div>
  </div>

  <dialog id="dialog-atribuir">
    <h3>Atribuir equipamento</h3>
    <form id="form-atribuir">
      <label>Responsável
        <input type="text" id="atribuir-responsavel" maxlength="80" required />
      </label>
      <label>Setor
        <input type="text" id="atribuir-setor" maxlength="60" required />
      </label>
      <label>Observação
        <input type="text" id="atribuir-observacao" maxlength="255" />
      </label>
      <div class="acoes">
        <button type="submit">Confirmar atribuição</button>
        <button type="button" id="btn-cancelar-atribuir" class="secundario">Cancelar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dialog-manutencao">
    <h3>Enviar para manutenção</h3>
    <form id="form-manutencao">
      <label>Motivo
        <input type="text" id="manutencao-motivo" maxlength="255" required />
      </label>
      <label>Custo estimado (R$)
        <input type="number" id="manutencao-custo" min="0.01" step="0.01" />
      </label>
      <label>Observação
        <input type="text" id="manutencao-observacao" maxlength="255" />
      </label>
      <div class="acoes">
        <button type="submit">Confirmar envio</button>
        <button type="button" id="btn-cancelar-manutencao" class="secundario">Cancelar</button>
      </div>
    </form>
  </dialog>

  <div id="aviso" class="aviso" hidden></div>

  <script src="equipamento-detalhe.js"></script>
</body>
</html>
