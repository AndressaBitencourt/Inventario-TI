<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  @page { size: A4 landscape; margin: 14mm; }
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: #1C2433;
    margin: 0;
  }
  .titulo { font-size: 20px; font-weight: 700; margin: 0 0 2px; }
  .subtitulo { font-size: 12px; color: #697184; margin: 0 0 10px; }
  svg { display: block; }
  .ator-label { font-size: 13px; font-weight: 700; font-family: Arial, sans-serif; text-anchor: middle; }
  .uc-label { font-size: 12px; font-family: Arial, sans-serif; text-anchor: middle; }
  .boundary-label { font-size: 13px; font-weight: 700; font-family: Arial, sans-serif; }
  .legenda { font-size: 11px; fill: #697184; font-family: Arial, sans-serif; }
</style>
</head>
<body>
  <p class="titulo">Diagrama de Caso de Uso — Inventário de TI</p>
  <p class="subtitulo">Dois papéis de usuário: Técnico (operação do dia a dia) e Admin (tudo do Técnico, mais exclusão e relatórios).</p>

  <svg viewBox="0 0 1100 650" width="1100" height="650" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="triangulo-oco" viewBox="0 0 16 12" refX="15" refY="6" markerWidth="14" markerHeight="11" orient="auto-start-reverse">
        <path d="M1,1 L15,6 L1,11 z" fill="#FFFFFF" stroke="#1C2433" stroke-width="1.2"/>
      </marker>
    </defs>

    <!-- ===================== Boundary ===================== -->
    <rect x="220" y="20" width="840" height="595" fill="#FBFCFE" stroke="#1C2433" stroke-width="1.5" rx="4"/>
    <text x="238" y="42" class="boundary-label">Sistema de Inventário de TI</text>

    <!-- ===================== Ator Técnico ===================== -->
    <g transform="translate(70,260)">
      <circle cx="0" cy="-28" r="12" fill="#FFFFFF" stroke="#1C2433" stroke-width="1.5"/>
      <line x1="0" y1="-16" x2="0" y2="18" stroke="#1C2433" stroke-width="1.5"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#1C2433" stroke-width="1.5"/>
      <line x1="0" y1="18" x2="-16" y2="44" stroke="#1C2433" stroke-width="1.5"/>
      <line x1="0" y1="18" x2="16" y2="44" stroke="#1C2433" stroke-width="1.5"/>
      <text x="0" y="66" class="ator-label">Técnico</text>
    </g>

    <!-- ===================== Ator Admin ===================== -->
    <g transform="translate(70,520)">
      <circle cx="0" cy="-28" r="12" fill="#FFFFFF" stroke="#1C2433" stroke-width="1.5"/>
      <line x1="0" y1="-16" x2="0" y2="18" stroke="#1C2433" stroke-width="1.5"/>
      <line x1="-20" y1="0" x2="20" y2="0" stroke="#1C2433" stroke-width="1.5"/>
      <line x1="0" y1="18" x2="-16" y2="44" stroke="#1C2433" stroke-width="1.5"/>
      <line x1="0" y1="18" x2="16" y2="44" stroke="#1C2433" stroke-width="1.5"/>
      <text x="0" y="66" class="ator-label">Admin</text>
    </g>

    <!-- Generalizacao Admin -> Tecnico (triangulo oco) -->
    <line x1="70" y1="450" x2="70" y2="330" stroke="#1C2433" stroke-width="1.3" marker-end="url(#triangulo-oco)"/>

    <!-- ===================== Casos de uso do Tecnico (coluna A) ===================== -->
    <g>
      <ellipse cx="430" cy="75"  rx="115" ry="25" fill="#FFFFFF" stroke="#1C2433" stroke-width="1.3"/>
      <text x="430" y="80" class="uc-label">Fazer login / logout</text>

      <ellipse cx="430" cy="137" rx="115" ry="25" fill="#FFFFFF" stroke="#1C2433" stroke-width="1.3"/>
      <text x="430" y="142" class="uc-label">Cadastrar equipamento</text>

      <ellipse cx="430" cy="199" rx="115" ry="25" fill="#FFFFFF" stroke="#1C2433" stroke-width="1.3"/>
      <text x="430" y="204" class="uc-label">Editar equipamento</text>

      <ellipse cx="430" cy="261" rx="115" ry="25" fill="#FFFFFF" stroke="#1C2433" stroke-width="1.3"/>
      <text x="430" y="266" class="uc-label">Atribuir equipamento</text>

      <ellipse cx="430" cy="323" rx="115" ry="25" fill="#FFFFFF" stroke="#1C2433" stroke-width="1.3"/>
      <text x="430" y="328" class="uc-label">Devolver equipamento</text>

      <ellipse cx="430" cy="385" rx="115" ry="25" fill="#FFFFFF" stroke="#1C2433" stroke-width="1.3"/>
      <text x="430" y="390" class="uc-label">Abrir manutenção</text>

      <ellipse cx="430" cy="447" rx="115" ry="25" fill="#FFFFFF" stroke="#1C2433" stroke-width="1.3"/>
      <text x="430" y="452" class="uc-label">Finalizar manutenção</text>

      <ellipse cx="430" cy="509" rx="115" ry="25" fill="#FFFFFF" stroke="#1C2433" stroke-width="1.3"/>
      <text x="430" y="514" class="uc-label">Dar baixa em equipamento</text>

      <ellipse cx="430" cy="571" rx="115" ry="25" fill="#FFFFFF" stroke="#1C2433" stroke-width="1.3"/>
      <text x="430" y="576" class="uc-label">Reativar equipamento</text>
    </g>

    <!-- Linhas Tecnico -> casos de uso coluna A -->
    <g stroke="#1C2433" stroke-width="1">
      <line x1="90" y1="260" x2="315" y2="75"/>
      <line x1="90" y1="260" x2="315" y2="137"/>
      <line x1="90" y1="260" x2="315" y2="199"/>
      <line x1="90" y1="263" x2="315" y2="261"/>
      <line x1="90" y1="266" x2="315" y2="323"/>
      <line x1="90" y1="266" x2="315" y2="385"/>
      <line x1="90" y1="266" x2="315" y2="447"/>
      <line x1="90" y1="266" x2="315" y2="509"/>
      <line x1="90" y1="266" x2="315" y2="571"/>
    </g>

    <!-- ===================== Casos de uso do Admin (coluna B) ===================== -->
    <g>
      <ellipse cx="860" cy="270" rx="125" ry="27" fill="#FFFFFF" stroke="#1C2433" stroke-width="1.3"/>
      <text x="860" y="275" class="uc-label">Excluir equipamento</text>

      <ellipse cx="860" cy="370" rx="125" ry="27" fill="#FFFFFF" stroke="#1C2433" stroke-width="1.3"/>
      <text x="860" y="375" class="uc-label">Visualizar relatórios</text>
    </g>

    <!-- Linhas Admin -> casos de uso coluna B. Rota em "L" passando por fora da
         coluna A (sobe a x=90, cruza no vao entre a 1a e a 2a elipse em y=106,
         desce pelo corredor livre entre as colunas em x=620) pra nao cruzar
         nenhuma elipse. -->
    <g stroke="#1C2433" stroke-width="1" fill="none">
      <polyline points="90,520 90,106 620,106 620,270 735,270"/>
      <polyline points="620,106 620,370 735,370"/>
    </g>

    <text x="50" y="638" class="legenda">Triângulo oco = generalização (Admin herda todos os casos de uso do Técnico, mais os dois exclusivos à direita).</text>
  </svg>
</body>
</html>
